name: Docs Check
on:
  push:
    branches:
      - main
    paths: [docs/**, i18n/**, src/**, static/**, scripts/**, docusaurus.config.ts, sidebars.ts, package.json, package-lock.json, tsconfig.json, .github/workflows/docs-check.yml]
  pull_request:
    paths: [docs/**, i18n/**, src/**, static/**, scripts/**, docusaurus.config.ts, sidebars.ts, package.json, package-lock.json, tsconfig.json, .github/workflows/docs-check.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - name: Install dependencies
        run: npm ci
      - name: Check documentation
        run: npm run check
