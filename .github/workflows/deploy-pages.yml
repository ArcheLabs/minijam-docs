name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - i18n/**
      - src/**
      - static/**
      - scripts/**
      - docusaurus.config.ts
      - sidebars.ts
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Compute site URL
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
          BASE_URL_OVERRIDE: ${{ vars.BASE_URL }}
        shell: bash
        run: |
          echo "SITE_URL=${SITE_URL_OVERRIDE:-https://docs.minijam.org}" >> "$GITHUB_ENV"
          echo "BASE_URL=${BASE_URL_OVERRIDE:-/}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Check i18n parity
        run: npm run check:i18n

      - name: Build for GitHub Pages
        env:
          SITE_URL: ${{ env.SITE_URL }}
          BASE_URL: ${{ env.BASE_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
